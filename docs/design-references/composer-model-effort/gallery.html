/* BB 밖에서 열 때만 쓰는 테마 토큰. 설치된 BB 앱 index CSS의 라이트·다크 값을 옮겼다. */
:root, .light {
  --canvas: oklch(100% 0 0); --ink: oklch(32.11% 0 0);
  --background: var(--canvas); --foreground: var(--ink); --card: var(--canvas); --popover: var(--canvas);
  --primary: oklch(27% 0 0); --primary-foreground: oklch(100% 0 0);
  --muted-foreground: oklch(44% 0 0); --subtle-foreground: oklch(50% 0 0);
  --border: color-mix(in oklch, var(--ink) 14%, var(--canvas)); --ring: var(--primary);
  --state-hover: color-mix(in oklab, var(--ink) 5.9%, transparent); --state-active: color-mix(in oklab, var(--ink) 11.8%, transparent);
  /* kit motion easing */
  --ease-out: cubic-bezier(.22,1,.36,1); --ease-droplet: cubic-bezier(.36,0,.18,1); --ease-exit: cubic-bezier(.4,0,.2,1);
}
.dark {
  --canvas: oklch(19.5% 0 0); --ink: oklch(81% 0 0);
  --primary: oklch(82% 0 0); --primary-foreground: oklch(21.78% 0 0);
  --muted-foreground: oklch(78% 0 0); --subtle-foreground: oklch(68% 0 0);
  --border: color-mix(in oklch, var(--ink) 19.4%, var(--canvas));
  --state-hover: color-mix(in oklab, var(--ink) 13.8%, transparent); --state-active: color-mix(in oklab, var(--ink) 22.5%, transparent);
}

/* ── 페이지 ── */
html, body { margin: 0; background: color-mix(in oklab, var(--foreground) 3%, var(--background)); color: var(--foreground);
  font: 13px/1.55 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
*, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; }
button { background-color: transparent; color: inherit; font: inherit; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
.intro h1 { font-size: 16px; line-height: 22px; font-weight: 600; margin: 0 0 6px; }
.intro p { margin: 0; color: var(--muted-foreground); font-size: 12px; line-height: 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 16px 0 4px; }
.control { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.control > span { color: var(--muted-foreground); }
.segmented { display: flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--state-hover); }
.segmented button { min-height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted-foreground); font: inherit; cursor: pointer; }
.segmented [aria-pressed="true"] { background: var(--background); color: var(--foreground); box-shadow: 0 1px 2px color-mix(in oklab, var(--foreground) 14%, transparent); }
.selection { margin: 10px 0 0; font-size: 12px; color: var(--muted-foreground); }
.selection strong { color: var(--foreground); font-weight: 600; }
.case { border-top: 1px solid var(--border); margin-top: 18px; padding-top: 16px; }
.case > header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.case-number { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.case h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
.metric { margin-left: auto; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.idea { margin: 6px 0 0; font-size: 12px; line-height: 18px; }
.how { margin: 10px 0 0; padding-left: 18px; font-size: 12px; line-height: 18px; color: var(--muted-foreground); }
.trade { margin: 6px 0 0; font-size: 11px; line-height: 17px; color: var(--muted-foreground); }
footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11px; line-height: 18px; color: var(--muted-foreground); }
code { font: 11px/1 "JetBrains Mono", ui-monospace, monospace; }
:is(.segmented button, .stage button):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

/* 휴대폰 화면 한 장을 흉내 낸다. 컴포저는 바닥에 붙고 위로 자란다. */
.stage { position: relative; display: flex; flex-direction: column; justify-content: flex-end; width: min(var(--stage-width), 100%); min-height: 148px;
  margin: 14px 0 0; padding: 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--background); overflow: hidden; }
.transcript { position: absolute; left: 20px; right: 20px; bottom: 18px; margin: 0; font-size: 13px; line-height: 20px; color: var(--foreground); pointer-events: none; }
.case[data-case="5"] .stage { min-height: 360px; }
.case[data-case="6"] .stage { min-height: 252px; padding-bottom: 84px; }
/* 이 시안만 아래 칸이 보이게 바닥 여백을 넓혔다. 대화는 다른 시안처럼 컴포저 뒤·위에 둔다. */
.case[data-case="6"] .transcript { bottom: 90px; }
.stage [data-proto-root] { width: 100%; }
.stage [data-bb-chat-ui-fluid-composer] { --bb-chat-ui-fluid-host-max: 320px; }
html[data-bb-chat-ui-root-device="phone"] .stage [data-bb-chat-ui-fluid-composer] { --bb-chat-ui-fluid-host-max: 295px; }
.stage button { font-family: inherit; }
.stage .ProseMirror { outline: none; }
.stage .ProseMirror p.is-editor-empty:first-child::before { color: var(--muted-foreground); }
.stage [data-promptbox-submit-action] { display: inline-flex; align-items: center; justify-content: center; border: 0; background: var(--primary); color: var(--primary-foreground); cursor: pointer; }
.stage [data-bb-chat-ui-fluid-details-toggle] { color: var(--foreground); }
.stage [data-bb-chat-ui-fluid-details-toggle][aria-expanded="true"] { background: var(--state-active); }

/* ── 시안 공통 ── */
[data-proto] { --proto-row: 48px; --proto-font: 12px; --proto-line: 16px; }
html[data-bb-chat-ui-root-device="phone"] [data-proto] { --proto-row: 52px; --proto-font: 13px; }
[data-proto-mark] { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 16px; height: 16px; }
[data-proto-send-group] { position: relative; }
[data-proto] [data-bb-chat-ui-fluid-row] > :is([data-bb-chat-ui-fluid-options], [data-bb-chat-ui-fluid-editor], [data-bb-chat-ui-fluid-actions]),
[data-proto] [data-bb-chat-ui-fluid-toggle] { transition: opacity 200ms var(--ease-out); }
[data-proto] [data-proto-icon-button] { width: var(--bb-chat-ui-fluid-control-size); height: var(--bb-chat-ui-fluid-control-size); min-width: var(--bb-chat-ui-fluid-control-size); padding: 0; border-radius: 999px; color: var(--foreground); }
[data-proto] [data-proto-icon-button] svg { width: 16px; height: 16px; }

/* 설정 줄이 열리면 같은 줄의 입력 요소를 내려 놓는다. 여러 줄이면 글은 남긴다. */
form:is([data-proto="1"], [data-proto="3"], [data-proto="4"])[data-proto-mode] :is([data-bb-chat-ui-fluid-options], [data-bb-chat-ui-fluid-actions], [data-bb-chat-ui-fluid-toggle]),
form:is([data-proto="1"], [data-proto="3"])[data-proto-mode] [data-bb-chat-ui-fluid-row]:not([data-multiline="true"]) > [data-bb-chat-ui-fluid-editor],
form[data-proto="4"][data-proto-mode]:not([data-proto-open]) [data-bb-chat-ui-fluid-row]:not([data-multiline="true"]) > [data-bb-chat-ui-fluid-editor] { opacity: 0; pointer-events: none; }

/* ── 설정 줄 (01·03·04) ── */
[data-proto-layer] { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: var(--proto-row); display: flex; align-items: center; gap: 4px; padding: 0 8px;
  opacity: 0; visibility: hidden; transform: translateY(4px);
  transition: opacity 160ms var(--ease-exit), transform 200ms var(--ease-exit), visibility 0s linear 200ms; }
[data-proto-layer] { container-type: inline-size; }
/* 좁은 화면의 설정 줄은 모델 칩을 기호만 남겨 눈금에 폭을 준다. */
@container (max-width: 330px) {
  [data-proto-layer][data-view="effort"] [data-proto-chip] { width: var(--bb-chat-ui-fluid-control-size); padding: 0; justify-content: center; }
  [data-proto-layer][data-view="effort"] [data-proto-chip-text] { display: none; }
}
[data-proto-layer][data-open] { opacity: 1; visibility: visible; transform: none;
  transition: opacity 240ms var(--ease-out) 60ms, transform 320ms var(--ease-out) 60ms, visibility 0s; }
[data-proto-chip] { flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 42%; height: var(--bb-chat-ui-fluid-control-size); padding: 0 12px 0 10px;
  border: 0; border-radius: 999px; background: var(--state-hover); color: var(--foreground); font-size: var(--proto-font); line-height: var(--proto-line); white-space: nowrap; cursor: pointer; }
[data-proto-chip]:hover { background: var(--state-active); }
[data-proto-chip] > svg { flex: none; }
[data-proto-chip-text] { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
[data-proto-slot] { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
[data-proto-pane] { position: absolute; inset: 0; display: flex; align-items: center; transition: opacity 200ms var(--ease-out), transform 260ms var(--ease-out); }
[data-proto-layer][data-view="effort"] [data-proto-pane="model"] { opacity: 0; pointer-events: none; transform: translateX(-12px); }
[data-proto-layer][data-view="model"] [data-proto-pane="effort"] { opacity: 0; pointer-events: none; transform: translateX(12px); }
[data-proto-ruler] { flex: 1 1 auto; min-width: 0; padding: 0; }
[data-proto-done] { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--bb-chat-ui-fluid-control-size); height: var(--bb-chat-ui-fluid-control-size);
  border: 0; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); cursor: pointer; }

/* 가로 모델 목록 */
[data-proto-strip] { display: flex; align-items: center; gap: 2px; width: 100%; height: 100%; padding: 0 12px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  mask-image: linear-gradient(to right, transparent, black 14px, black calc(100% - 14px), transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 14px, black calc(100% - 14px), transparent);
